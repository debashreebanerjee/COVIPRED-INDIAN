<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">Cross-dataset transfer metrics</title>
  <desc id="desc">Bar chart summarizing balanced accuracy for the Brazil-trained and Italy-trained models on external cohorts, against a 0.50 chance reference.</desc>
  <style>
    .bg { fill: #fbfcfe; }
    .title { fill: #0f172a; font: 22px Arial, sans-serif; font-weight: bold; }
    .subtitle { fill: #334155; font: 13px Arial, sans-serif; }
    .axis { stroke: #475569; stroke-width: 1.2; }
    .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
    .chance { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 8 4; }
    .chanceLabel { fill: #475569; font: 11px Arial, sans-serif; font-style: italic; }
    .label { fill: #0f172a; font: 13px Arial, sans-serif; }
    .small { fill: #475569; font: 12px Arial, sans-serif; }
    .value { fill: #0f172a; font: 12px Arial, sans-serif; font-weight: bold; }
    .divider { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <rect class="bg" x="0" y="0" width="1100" height="460"/>
  <text class="title" x="40" y="42">Cross-dataset transfer overview</text>
  <text class="subtitle" x="40" y="64">Balanced accuracy on external cohorts from Brazil.ipynb and Italy.ipynb</text>

  <rect fill="#1d4ed8" x="810" y="28" width="14" height="14" rx="3"/>
  <text class="small" x="832" y="40">Brazil-trained model</text>
  <rect fill="#dc2626" x="960" y="28" width="14" height="14" rx="3"/>
  <text class="small" x="982" y="40">Italy-trained model</text>

  <line class="axis" x1="90" y1="350" x2="1040" y2="350"/>
  <line class="axis" x1="90" y1="100" x2="90" y2="350"/>

  <line class="grid" x1="90" y1="350" x2="1040" y2="350"/>
  <text class="small" x="78" y="354" text-anchor="end">0.00</text>
  <line class="grid" x1="90" y1="300" x2="1040" y2="300"/>
  <text class="small" x="78" y="304" text-anchor="end">0.20</text>
  <line class="grid" x1="90" y1="250" x2="1040" y2="250"/>
  <text class="small" x="78" y="254" text-anchor="end">0.40</text>
  <line class="grid" x1="90" y1="200" x2="1040" y2="200"/>
  <text class="small" x="78" y="204" text-anchor="end">0.60</text>
  <line class="grid" x1="90" y1="150" x2="1040" y2="150"/>
  <text class="small" x="78" y="154" text-anchor="end">0.80</text>
  <line class="grid" x1="90" y1="100" x2="1040" y2="100"/>
  <text class="small" x="78" y="104" text-anchor="end">1.00</text>

  <rect fill="#1d4ed8" x="140" y="219.6" width="90" height="130.4" rx="4"/>
  <text class="value" x="185" y="210.6" text-anchor="middle">0.522</text>
  <text class="label" x="185" y="376" text-anchor="middle">Brazil - India 375</text>

  <rect fill="#1d4ed8" x="280" y="214.2" width="90" height="135.8" rx="4"/>
  <text class="value" x="325" y="205.2" text-anchor="middle">0.543</text>
  <text class="label" x="325" y="376" text-anchor="middle">Brazil - India 600</text>

  <rect fill="#1d4ed8" x="420" y="182.5" width="90" height="167.5" rx="4"/>
  <text class="value" x="465" y="173.5" text-anchor="middle">0.670</text>
  <text class="label" x="465" y="376" text-anchor="middle">Brazil - Italy</text>

  <rect fill="#dc2626" x="610" y="227.5" width="90" height="122.5" rx="4"/>
  <text class="value" x="655" y="218.5" text-anchor="middle">0.490</text>
  <text class="label" x="655" y="376" text-anchor="middle">Italy - India 375</text>

  <rect fill="#dc2626" x="750" y="224.6" width="90" height="125.4" rx="4"/>
  <text class="value" x="795" y="215.6" text-anchor="middle">0.502</text>
  <text class="label" x="795" y="376" text-anchor="middle">Italy - India 600</text>

  <rect fill="#dc2626" x="890" y="180.4" width="90" height="169.6" rx="4"/>
  <text class="value" x="935" y="171.4" text-anchor="middle">0.678</text>
  <text class="label" x="935" y="376" text-anchor="middle">Italy - Brazil</text>

  <line class="chance" x1="90" y1="225" x2="1040" y2="225"/>
  <text class="chanceLabel" x="560" y="217" text-anchor="middle">chance 0.50</text>

  <text class="small" x="40" y="420">Best transfer result: Italy on Brazil with 0.678 balanced accuracy.</text>
  <text class="small" x="40" y="440">Both models sit near chance on the Indian cohorts and clear it only on each other.</text>
</svg>
