<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">Cross-dataset transfer metrics</title>
  <desc id="desc">Bar chart summarizing balanced accuracy for Brazil and Italy models on external cohorts.</desc>
  <style>
    .bg { fill: #fbfcfe; }
    .title { fill: #0f172a; font: 22px Arial, sans-serif; font-weight: bold; }
    .subtitle { fill: #334155; font: 13px Arial, sans-serif; }
    .axis { stroke: #475569; stroke-width: 1.2; }
    .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
    .label { fill: #0f172a; font: 13px Arial, sans-serif; }
    .small { fill: #475569; font: 12px Arial, sans-serif; }
    .barBrazil { fill: #1d4ed8; }
    .barItaly { fill: #dc2626; }
    .value { fill: #0f172a; font: 12px Arial, sans-serif; font-weight: bold; }
  </style>
  <rect class="bg" x="0" y="0" width="1100" height="460"/>
  <text class="title" x="40" y="42">Cross-dataset transfer overview</text>
  <text class="subtitle" x="40" y="64">Balanced accuracy on external cohorts from Brazil.ipynb and Italy.ipynb</text>

  <rect class="barBrazil" x="810" y="28" width="14" height="14"/>
  <text class="small" x="832" y="40">Brazil-trained model</text>
  <rect class="barItaly" x="960" y="28" width="14" height="14"/>
  <text class="small" x="982" y="40">Italy-trained model</text>

  <line class="axis" x1="90" y1="350" x2="1040" y2="350"/>
  <line class="axis" x1="90" y1="100" x2="90" y2="350"/>

  <line class="grid" x1="90" y1="350" x2="1040" y2="350"/>
  <line class="grid" x1="90" y1="300" x2="1040" y2="300"/>
  <line class="grid" x1="90" y1="250" x2="1040" y2="250"/>
  <line class="grid" x1="90" y1="200" x2="1040" y2="200"/>
  <line class="grid" x1="90" y1="150" x2="1040" y2="150"/>
  <line class="grid" x1="90" y1="100" x2="1040" y2="100"/>

  <text class="small" x="58" y="354">0.00</text>
  <text class="small" x="58" y="304">0.20</text>
  <text class="small" x="58" y="254">0.40</text>
  <text class="small" x="58" y="204">0.60</text>
  <text class="small" x="58" y="154">0.80</text>
  <text class="small" x="58" y="104">1.00</text>

  <rect class="barBrazil" x="140" y="225.8" width="90" height="124.2"/>
  <text class="value" x="161" y="217">0.497</text>
  <text class="label" x="130" y="376">Brazil - India 375</text>

  <rect class="barBrazil" x="280" y="220.4" width="90" height="129.6"/>
  <text class="value" x="301" y="212">0.518</text>
  <text class="label" x="268" y="376">Brazil - India 600</text>

  <rect class="barBrazil" x="420" y="189.7" width="90" height="160.3"/>
  <text class="value" x="441" y="181">0.641</text>
  <text class="label" x="425" y="376">Brazil - Italy</text>

  <rect class="barItaly" x="610" y="230.8" width="90" height="119.2"/>
  <text class="value" x="631" y="222">0.477</text>
  <text class="label" x="604" y="376">Italy - India 375</text>

  <rect class="barItaly" x="750" y="214.2" width="90" height="135.8"/>
  <text class="value" x="771" y="206">0.543</text>
  <text class="label" x="744" y="376">Italy - India 600</text>

  <rect class="barItaly" x="890" y="181.5" width="90" height="168.5"/>
  <text class="value" x="911" y="173">0.674</text>
  <text class="label" x="887" y="376">Italy - Brazil</text>

  <text class="small" x="40" y="420">Best transfer result: Italy-trained model evaluated on Brazil with 0.674 balanced accuracy.</text>
</svg>
